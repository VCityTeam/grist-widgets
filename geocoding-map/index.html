<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Geocoding Map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: sans-serif;
      }
      body {
        display: flex;
      }
      #panel {
        width: 280px;
        min-width: 280px;
        height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 12px;
        border-right: 1px solid #ccc;
      }
      #panel.collapsed {
        width: 0;
        min-width: 0;
        padding: 0;
        border-right: none;
        overflow: hidden;
      }
      #panel-toggle-btn {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 1001;
        font-size: 12px;
        padding: 6px 10px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px 0;
      }
      #address {
        font-size: 13px;
        margin-bottom: 10px;
        word-break: break-word;
      }
      #address .label {
        font-weight: bold;
      }
      #geocode-btn {
        font-size: 13px;
        padding: 6px 12px;
        cursor: pointer;
        margin-bottom: 12px;
      }
      #geocode-btn:disabled {
        cursor: default;
        opacity: 0.6;
      }
      table#fields {
        border-collapse: collapse;
        font-size: 13px;
        margin-bottom: 12px;
        width: 100%;
      }
      table#fields th,
      table#fields td {
        border: 1px solid #ccc;
        padding: 4px 8px;
        text-align: left;
      }
      table#fields th {
        font-weight: normal;
        color: #666;
      }
      #display-name {
        font-size: 12px;
        color: #666;
        margin-bottom: 12px;
        word-break: break-word;
      }
      #error {
        font-size: 12px;
        color: #a33;
        white-space: pre-wrap;
        margin-bottom: 12px;
      }
      #log {
        font-family: monospace;
        font-size: 11px;
        color: #666;
        border-top: 1px solid #ccc;
        padding-top: 8px;
        max-height: 200px;
        overflow-y: auto;
      }
      #log div {
        margin-bottom: 2px;
      }
      #map-container {
        position: relative;
        flex: 1;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
        background: #eee;
      }
      #status {
        position: absolute;
        bottom: 10px;
        left: 10px;
        right: 10px;
        padding: 8px 10px;
        border-radius: 4px;
        font-size: 12px;
        color: #a33;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #ccc;
        white-space: pre-wrap;
        display: none;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./app.js"></script>
    <div id="panel" class="collapsed">
      <h1>Geocoding Map</h1>
      <div id="address"><span class="label">Address:</span> <span id="address-value">—</span></div>
      <button id="geocode-btn">Geocode this record</button>
      <table id="fields">
        <tbody>
          <tr><th>Latitude</th><td id="f-lat">—</td></tr>
          <tr><th>Longitude</th><td id="f-lon">—</td></tr>
          <tr><th>OSM Type</th><td id="f-osm-type">—</td></tr>
          <tr><th>OSM ID</th><td id="f-osm-id">—</td></tr>
          <tr><th>Admin. level</th><td id="f-admin-level">—</td></tr>
          <tr><th>Address rank</th><td id="f-address-rank">—</td></tr>
          <tr><th>GeoJSON</th><td id="f-geojson">—</td></tr>
        </tbody>
      </table>
      <div id="display-name"></div>
      <div id="error"></div>
      <div id="log"></div>
    </div>
    <div id="map-container">
      <button id="panel-toggle-btn">« Hide panel</button>
      <div id="map"></div>
      <div id="status"></div>
    </div>
  </body>
</html>
