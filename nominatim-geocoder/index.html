<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Nominatim Geocoder</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: sans-serif;
        box-sizing: border-box;
        overflow: auto;
      }
      body {
        padding: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px 0;
      }
      #address {
        font-size: 13px;
        margin-bottom: 10px;
        word-break: break-word;
      }
      #address .label {
        font-weight: bold;
      }
      #geocode-btn {
        font-size: 13px;
        padding: 6px 12px;
        cursor: pointer;
        margin-bottom: 12px;
      }
      #geocode-btn:disabled {
        cursor: default;
        opacity: 0.6;
      }
      table#fields {
        border-collapse: collapse;
        font-size: 13px;
        margin-bottom: 12px;
      }
      table#fields th,
      table#fields td {
        border: 1px solid #ccc;
        padding: 4px 8px;
        text-align: left;
      }
      table#fields th {
        font-weight: normal;
        color: #666;
      }
      #display-name {
        font-size: 12px;
        color: #666;
        margin-bottom: 12px;
        word-break: break-word;
      }
      #error {
        font-size: 12px;
        color: #a33;
        white-space: pre-wrap;
        margin-bottom: 12px;
      }
      #log {
        font-family: monospace;
        font-size: 11px;
        color: #666;
        border-top: 1px solid #ccc;
        padding-top: 8px;
        max-height: 200px;
        overflow-y: auto;
      }
      #log div {
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./app.js"></script>
    <h1>Nominatim Geocoder</h1>
    <div id="address"><span class="label">Address:</span> <span id="address-value">—</span></div>
    <button id="geocode-btn">Geocode this record</button>
    <table id="fields">
      <tbody>
        <tr><th>Latitude</th><td id="f-lat">—</td></tr>
        <tr><th>Longitude</th><td id="f-lon">—</td></tr>
        <tr><th>OSM Type</th><td id="f-osm-type">—</td></tr>
        <tr><th>OSM ID</th><td id="f-osm-id">—</td></tr>
        <tr><th>Admin. level</th><td id="f-admin-level">—</td></tr>
        <tr><th>Address rank</th><td id="f-address-rank">—</td></tr>
      </tbody>
    </table>
    <div id="display-name"></div>
    <div id="error"></div>
    <div id="log"></div>
  </body>
</html>
