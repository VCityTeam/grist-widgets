<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Schema ER Diagram</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #ccc;
        font-size: 13px;
      }
      #toolbar select,
      #toolbar button {
        font-size: 13px;
      }
      #toolbar button {
        padding: 3px 10px;
        cursor: pointer;
      }
      #status {
        margin-left: auto;
        color: #666;
      }
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #canvas {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
      }
      #canvas:active {
        cursor: grabbing;
      }
      #diagram {
        position: absolute;
        transform-origin: 0 0;
        user-select: none;
        padding: 20px;
      }
      #source-container {
        width: 35%;
        display: none;
        border-left: 1px solid #ccc;
      }
      #source-container.open {
        display: flex;
      }
      #source {
        flex: 1;
        resize: none;
        border: none;
        outline: none;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
        white-space: pre;
      }
      #error {
        position: absolute;
        bottom: 10px;
        left: 10px;
        right: 10px;
        padding: 10px;
        border: 1px solid #c00;
        border-radius: 4px;
        background: #fff0f0;
        color: #900;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        display: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label>
        Table:
        <select id="table-select"></select>
      </label>
      <button id="refresh-btn" title="Re-read the document's schema">
        Refresh
      </button>
      <button id="source-btn">Show source</button>
      <button id="copy-btn" title="Copy the Mermaid source">Copy</button>
      <button id="reset-view-btn" title="Reset zoom and pan">Reset view</button>
      <span id="status"></span>
    </div>
    <div id="main">
      <div id="canvas">
        <div id="error"></div>
        <div id="diagram"></div>
      </div>
      <div id="source-container">
        <textarea id="source" readonly spellcheck="false"></textarea>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
