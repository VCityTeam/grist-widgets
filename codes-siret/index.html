<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Codes SIRET</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: sans-serif;
      }
      #panel {
        height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px 0;
      }
      #query {
        font-size: 13px;
        margin-bottom: 10px;
        word-break: break-word;
      }
      #query .label {
        font-weight: bold;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 13px;
      }
      #lookup-btn {
        font-size: 13px;
        padding: 6px 12px;
        cursor: pointer;
      }
      #lookup-btn:disabled {
        cursor: default;
        opacity: 0.6;
      }
      table#fields {
        border-collapse: collapse;
        font-size: 13px;
        margin-bottom: 12px;
        width: 100%;
      }
      table#fields th,
      table#fields td {
        border: 1px solid #ccc;
        padding: 4px 8px;
        text-align: left;
        word-break: break-word;
      }
      table#fields th {
        font-weight: normal;
        color: #666;
        width: 40%;
      }
      table#fields tr.unmapped {
        opacity: 0.5;
      }
      #error {
        font-size: 12px;
        color: #a33;
        white-space: pre-wrap;
        margin-bottom: 12px;
      }
      #log {
        font-family: monospace;
        font-size: 11px;
        color: #666;
        border-top: 1px solid #ccc;
        padding-top: 8px;
        max-height: 200px;
        overflow-y: auto;
      }
      #log div {
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./app.js"></script>
    <div id="panel">
      <h1>Codes SIRET</h1>
      <div id="query">
        <span class="label">Query:</span> <span id="query-value">—</span>
      </div>
      <div id="controls">
        <button id="lookup-btn">Look up this record</button>
        <label
          title="When unchecked, the first matching establishment's data is used instead of the head office's. A query that is itself a 14-digit SIRET always uses that establishment."
        >
          <input type="checkbox" id="use-siege" checked />
          Prefer head office (siège)
        </label>
      </div>
      <table id="fields">
        <tbody></tbody>
      </table>
      <div id="error"></div>
      <div id="log"></div>
    </div>
  </body>
</html>
