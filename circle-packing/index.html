<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Circle Packing</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #ccc;
      }
      #breadcrumb {
        padding: 8px 12px;
        font-size: 13px;
        white-space: nowrap;
        overflow-x: auto;
      }
      #limit-control {
        flex: 0 0 auto;
        padding: 8px 12px;
        font-size: 12px;
        white-space: nowrap;
        color: #555;
      }
      #limit-control input {
        width: 56px;
        margin-left: 4px;
      }
      #breadcrumb span {
        cursor: pointer;
        color: #06c;
      }
      #breadcrumb span:hover {
        text-decoration: underline;
      }
      #breadcrumb span.current {
        cursor: default;
        color: #333;
        text-decoration: none;
        font-weight: bold;
      }
      #breadcrumb .sep {
        color: #999;
        cursor: default;
        margin: 0 4px;
      }
      #chart-container {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #chart {
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
      #status {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        padding: 8px 10px;
        border-radius: 4px;
        font-size: 12px;
        color: #a33;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #ccc;
        white-space: pre-wrap;
        display: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./app.js"></script>
    <div id="header">
      <div id="breadcrumb"></div>
      <label id="limit-control">
        Limit per group
        <input type="number" id="category-limit" min="1" step="1" placeholder="none" />
      </label>
    </div>
    <div id="chart-container">
      <svg id="chart"></svg>
      <div id="status"></div>
    </div>
  </body>
</html>
